 
<!DOCTYPE html>
<html lang="tr">
<head>
<link rel="icon" href="favicon0.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRV GAMES Tren kaçıcıları</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #70d6ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        #ui .high-score-text {
            color: #ffd700;
            font-size: 20px;
        }
        #ui .status-text {
            font-size: 18px;
            color: #a855f7;
        }
        #ui .token-text {
            font-size: 18px;
            color: #eab308;
        }
        #ui .magnet-text {
            font-size: 18px;
            color: #ef4444;
        }

        /* --- ÜST SAĞ KONTROL BUTONLARI --- */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 15;
        }
        .icon-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #fff;
            border-radius: 50%;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .icon-btn:hover {
            transform: scale(1.1);
        }

        /* --- MODAL EKRANLARI (BAŞLANGIÇ, PAUSE, GAME OVER) --- */
        .overlay-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #2f3542;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 3px solid #3b82f6;
            z-index: 20;
        }
        .overlay-screen h1 {
            margin: 0 0 15px 0;
            font-size: 36px;
            color: #2563eb;
        }
        .overlay-screen button {
            margin-top: 15px;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #2563eb, #3b82f6);
            color: white;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: 0.2s;
            display: block;
            width: 100%;
        }
        .overlay-screen button:hover {
            transform: scale(1.03);
        }

        .btn-revive {
            background: linear-gradient(45deg, #eab308, #ca8a04) !important;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4) !important;
        }

        /* --- DOKUNMATİK YÖN TUŞLARI VE HIZ KONTROLÜ --- */
        .controls-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn-group-left {
            display: flex;
            gap: 15px;
        }
        .btn-group-right {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        .touch-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            color: #2f3542;
            font-size: 30px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            touch-action: manipulation;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(0.95);
        }
        .btn-jump {
            width: 85px;
            height: 85px;
            border-radius: 25px;
            background: rgba(59, 130, 246, 0.6);
            border-color: rgba(255, 255, 255, 0.9);
            color: white;
        }
        .btn-speed {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.6);
            border-color: rgba(255, 255, 255, 0.9);
            color: white;
            font-size: 28px;
        }
        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #fff;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div>Skor: <span id="score">0</span></div>
        <div class="high-score-text">🏆 Yüksek Skor: <span id="high-score">0</span></div>
        <div class="status-text">🧪 İksir: <span id="potion-count">0</span></div>
        <div class="token-text">🟡 Jeton: <span id="token-count">0</span></div>
        <div class="magnet-text" id="magnet-ui" style="display: none;">🧲 Mıknatıs Aktif!</div>
    </div>

    <!-- SAĞ ÜST KONTROL BUTONLARI -->
    <div class="top-controls">
        <div class="icon-btn" id="btn-sound" onclick="toggleSound()">🔊</div>
        <div class="icon-btn" id="btn-pause" onclick="togglePause()">⏸</div>
    </div>

    <!-- BAŞLANGIÇ EKRANI -->
    <div id="start-screen" class="overlay-screen">
        <h1>TREN KAÇICILARI</h1>
        <p style="font-size: 18px; color: #64748b;">Koşmaya başlamak için hazır mısın?</p>
        <button onclick="startGame()">OYUNU BAŞLAT</button>
    </div>

    <!-- DURAKLATMA EKRANI -->
    <div id="pause-screen" class="overlay-screen" style="display: none; border-color: #f59e0b;">
        <h1 style="color: #f59e0b;">OYUN DURAKLATILDI</h1>
        <button onclick="togglePause()">DEVAM ET</button>
    </div>

    <!-- GAME OVER EKRANI -->
    <div id="game-over" class="overlay-screen" style="display: none; border-color: #ff4757;">
        <h1 style="color: #ff4757;">ÇARPIŞMA!</h1>
        <div style="font-size: 20px; margin-top: 10px;">Skor: <span id="final-score">0</span></div>
        <div style="font-size: 20px; margin-top: 5px; color: #eab308;">🏆 En Yüksek Skor: <span id="final-high-score">0</span></div>
        
        <button id="btn-revive" class="btn-revive" onclick="reviveGame()" style="display: none;">🪙 JETON KULLAN (CANLAN)</button>
        <button onclick="resetGame()" style="background: linear-gradient(45deg, #ff4757, #ff6b81);">YENİDEN BAŞLA</button>
    </div>

    <!-- EKRAN DOKUNMATİK TUŞLARI -->
    <div class="controls-container">
        <div class="btn-group-left">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group-right">
            <div class="touch-btn btn-speed" id="btn-speed">⚡<div class="badge" id="potion-badge">0</div></div>
            <div class="touch-btn btn-jump" id="btn-jump">▲</div>
        </div>
    </div>

    <script>
        // --- GELİŞMİŞ SES VE MÜZİK SİSTEMİ ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let bgMusicTimer = null;
        let musicNoteIndex = 0;
        let isMuted = false;

        const happyMelody = [
            261.63, 329.63, 392.00, 523.25, 392.00, 329.63,
            293.66, 349.23, 440.00, 587.33, 440.00, 349.23,
            329.63, 392.00, 493.88, 659.25, 493.88, 392.00,
            392.00, 440.00, 493.88, 523.25, 523.25, 0
        ];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
                startBgMusic();
            }
        }

        function toggleSound() {
            isMuted = !isMuted;
            document.getElementById('btn-sound').innerText = isMuted ? '🔇' : '🔊';
        }

        function startBgMusic() {
            if (bgMusicTimer) return;
            bgMusicTimer = setInterval(() => {
                if (isGameOver || isPaused || isMuted || !gameStarted || !audioCtx) return;
                const freq = happyMelody[musicNoteIndex];
                if (freq > 0) {
                    playSynthNote(freq);
                }
                musicNoteIndex = (musicNoteIndex + 1) % happyMelody.length;
            }, 180);
        }

        function playSynthNote(freq) {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.15);
        }

        function playSound(type) {
            if (!audioCtx || isMuted) return;
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'coin') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.setValueAtTime(1300, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'powerup') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'boost') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.4);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'crash') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'horn') {
                const freqs = [311.13, 370.00];
                freqs.forEach(freq => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now);
                    osc.frequency.linearRampToValueAtTime(freq * 1.02, now + 0.4);
                    osc.frequency.linearRampToValueAtTime(freq, now + 0.8);

                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
                    gain.gain.setValueAtTime(0.2, now + 0.6);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.9);
                });
            } else if (type === 'rail') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(90, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.04);

                gain.gain.setValueAtTime(0.04, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.04);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.04);
            } else if (type === 'revive') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // --- SAHNE KURULUMU ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x70d6ff);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- IŞIKLANDIRMA ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 1.1);
        dirLight.position.set(30, 50, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- DEĞİŞKENLER VE DURUM KONTROLLERİ ---
        const LANES = [-3.5, 0, 3.5];
        let currentLane = 1;
        let targetX = LANES[currentLane];
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = -0.016;

        let groundY = 0;
        let baseGameSpeed = 0.45;
        let gameSpeed = 0.45;
        let score = 0;
        let highScore = localStorage.getItem('subway_runner_highscore') || 0;
        document.getElementById('high-score').innerText = highScore;

        // İksir, Mıknatıs ve Jeton Durumları (localStorage Entegrasyonu)
        let potionCount = parseInt(localStorage.getItem('subway_runner_potions')) || 0;
        let tokenCount = parseInt(localStorage.getItem('subway_runner_tokens')) || 0;

        let isSpeedBoosted = false;
        let speedBoostTimer = 0;

        let isMagnetActive = false;
        let magnetTimer = 0;

        let isInvincible = false;
        let invincibleTimer = 0;

        let gameStarted = false;
        let isPaused = false;
        let isGameOver = false;

        let animTime = 0;
        let railSoundTimer = 0;

        const obstacles = [];
        const coins = [];
        const potions = [];
        const magnets = [];
        const tokens = [];
        const buildings = [];

        // UI İlk Yükleme
        updatePotionUI();
        updateTokenUI();

        // --- YOL & RAYLAR ---
        const roadGeo = new THREE.PlaneGeometry(14, 400);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.6 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -150;
        road.receiveShadow = true;
        scene.add(road);

        LANES.forEach(x => {
            [-0.8, 0.8].forEach(offset => {
                const railGeo = new THREE.BoxGeometry(0.12, 0.1, 400);
                const railMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.9 });
                const rail = new THREE.Mesh(railGeo, railMat);
                rail.position.set(x + offset, 0.05, -150);
                scene.add(rail);
            });
        });

        // --- KARAKTER ---
        const playerGroup = new THREE.Group();

        const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2563eb });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.4;
        body.castShadow = true;
        playerGroup.add(body);

        const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 2.25;
        head.castShadow = true;
        playerGroup.add(head);

        const hatGeo = new THREE.BoxGeometry(0.55, 0.15, 0.7);
        const hatMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
        const hat = new THREE.Mesh(hatGeo, hatMat);
        hat.position.set(0, 2.55, -0.05);
        playerGroup.add(hat);

        // Hız Efekti Aura Mesh
        const auraGeo = new THREE.SphereGeometry(1.6, 16, 16);
        const auraMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35, wireframe: true });
        const speedAura = new THREE.Mesh(auraGeo, auraMat);
        speedAura.position.y = 1.4;
        speedAura.visible = false;
        playerGroup.add(speedAura);

        function createLimb(color, width, height, depth) {
            const joint = new THREE.Group();
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                new THREE.MeshStandardMaterial({ color })
            );
            mesh.position.y = -height / 2;
            mesh.castShadow = true;
            joint.add(mesh);
            return { joint, mesh };
        }

        const leftArmData = createLimb(0x2563eb, 0.25, 0.7, 0.25);
        leftArmData.joint.position.set(-0.55, 1.9, 0);
        const leftHand = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
        leftHand.position.set(0, -0.75, 0);
        leftArmData.joint.add(leftHand);
        playerGroup.add(leftArmData.joint);

        const rightArmData = createLimb(0x2563eb, 0.25, 0.7, 0.25);
        rightArmData.joint.position.set(0.55, 1.9, 0);
        const rightHand = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
        rightHand.position.set(0, -0.75, 0);
        rightArmData.joint.add(rightHand);
        playerGroup.add(rightArmData.joint);

        const leftLegData = createLimb(0x1e293b, 0.3, 0.8, 0.3);
        leftLegData.joint.position.set(-0.25, 0.8, 0);
        const leftFoot = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.2, 0.5), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        leftFoot.position.set(0, -0.85, 0.1);
        leftLegData.joint.add(leftFoot);
        playerGroup.add(leftLegData.joint);

        const rightLegData = createLimb(0x1e293b, 0.3, 0.8, 0.3);
        rightLegData.joint.position.set(0.25, 0.8, 0);
        const rightFoot = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.2, 0.5), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        rightFoot.position.set(0, -0.85, 0.1);
        rightLegData.joint.add(rightFoot);
        playerGroup.add(rightLegData.joint);

        scene.add(playerGroup);

        camera.position.set(0, 4.5, 8);
        camera.lookAt(0, 1.5, -5);

        // --- NESNE OLUŞTURUCULAR ---
        function createBuilding(zPos, side) {
            const height = 15 + Math.random() * 25;
            const width = 8 + Math.random() * 4;
            const depth = 10 + Math.random() * 10;
            const xPos = side === 'left' ? -13 - width / 2 : 13 + width / 2;

            const brightColors = [0x38bdf8, 0xf43f5e, 0xfacc15, 0x4ade80, 0xa855f7];
            const bldgGeo = new THREE.BoxGeometry(width, height, depth);
            const bldgMat = new THREE.MeshStandardMaterial({ 
                color: brightColors[Math.floor(Math.random() * brightColors.length)],
                roughness: 0.3
            });
            const building = new THREE.Mesh(bldgGeo, bldgMat);
            building.position.set(xPos, height / 2, zPos);
            building.castShadow = true;
            building.receiveShadow = true;

            scene.add(building);
            buildings.push(building);
        }

        function createTrain(zPos) {
            const laneIndex = Math.floor(Math.random() * 3);
            const xPos = LANES[laneIndex];
            const isMoving = Math.random() > 0.5;

            const trainGroup = new THREE.Group();

            const trainGeo = new THREE.BoxGeometry(2.6, 2.5, 12);
            const trainMat = new THREE.MeshStandardMaterial({ 
                color: isMoving ? 0xff0055 : 0xff9f1c,
                metalness: 0.2, 
                roughness: 0.3 
            });
            const trainMesh = new THREE.Mesh(trainGeo, trainMat);
            trainMesh.position.y = 1.25;
            trainMesh.castShadow = true;
            trainMesh.receiveShadow = true;
            trainGroup.add(trainMesh);

            const glassGeo = new THREE.BoxGeometry(2.2, 1, 0.2);
            const glassMat = new THREE.MeshBasicMaterial({ color: 0x00f5d4 });
            const glass = new THREE.Mesh(glassGeo, glassMat);
            glass.position.set(0, 1.8, 6.01);
            trainGroup.add(glass);

            trainGroup.position.set(xPos, 0, zPos);
            trainGroup.userData = { 
                type: 'train', 
                isMoving: isMoving, 
                moveSpeed: isMoving ? 0.3 : 0,
                width: 2.6,
                height: 2.5,
                depth: 12,
                hornBlown: false
            };

            scene.add(trainGroup);
            obstacles.push(trainGroup);
        }

        // ALTIN (Parlak Sarı)
        function createCoin(zPos) {
            const laneIndex = Math.floor(Math.random() * 3);
            const xPos = LANES[laneIndex];

            const coinGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.15, 16);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd000, metalness: 0.8, roughness: 0.2, emissive: 0x332a00 });
            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(xPos, 1.2, zPos);
            coin.castShadow = true;

            scene.add(coin);
            coins.push(coin);
        }

        // HIZLI KOŞMA İKSİRİ (Mor Şişe)
        function createPotion(zPos) {
            const laneIndex = Math.floor(Math.random() * 3);
            const xPos = LANES[laneIndex];

            const potionGroup = new THREE.Group();

            const bottleGeo = new THREE.CylinderGeometry(0.3, 0.35, 0.7, 12);
            const bottleMat = new THREE.MeshStandardMaterial({ color: 0xa855f7, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.9 });
            const bottle = new THREE.Mesh(bottleGeo, bottleMat);
            bottle.position.y = 0.35;
            potionGroup.add(bottle);

            const neckGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.3, 10);
            const neckMat = new THREE.MeshStandardMaterial({ color: 0xd8b4fe });
            const neck = new THREE.Mesh(neckGeo, neckMat);
            neck.position.y = 0.75;
            potionGroup.add(neck);

            const corkGeo = new THREE.CylinderGeometry(0.14, 0.1, 0.15, 10);
            const corkMat = new THREE.MeshStandardMaterial({ color: 0x854d0e });
            const cork = new THREE.Mesh(corkGeo, corkMat);
            cork.position.y = 0.92;
            potionGroup.add(cork);

            potionGroup.position.set(xPos, 1.0, zPos);
            scene.add(potionGroup);
            potions.push(potionGroup);
        }

        // MIKNATIS (U-Şeklinde)
        function createMagnet(zPos) {
            const laneIndex = Math.floor(Math.random() * 3);
            const xPos = LANES[laneIndex];

            const magnetGroup = new THREE.Group();
            const magMatRed = new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.5 });
            const magMatSilver = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9 });

            const baseGeo = new THREE.BoxGeometry(0.8, 0.25, 0.25);
            const baseMesh = new THREE.Mesh(baseGeo, magMatRed);
            baseMesh.position.y = 0.8;
            magnetGroup.add(baseMesh);

            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.6, 0.25), magMatRed);
            leftArm.position.set(-0.275, 0.4, 0);
            magnetGroup.add(leftArm);

            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.6, 0.25), magMatRed);
            rightArm.position.set(0.275, 0.4, 0);
            magnetGroup.add(rightArm);

            const leftTip = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 0.25), magMatSilver);
            leftTip.position.set(-0.275, 0.05, 0);
            magnetGroup.add(leftTip);

            const rightTip = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 0.25), magMatSilver);
            rightTip.position.set(0.275, 0.05, 0);
            magnetGroup.add(rightTip);

            magnetGroup.position.set(xPos, 1.0, zPos);
            scene.add(magnetGroup);
            magnets.push(magnetGroup);
        }

        // YENİDEN CANLANMA JETONU (Yıldızlı Altın Jeton)
        function createToken(zPos) {
            const laneIndex = Math.floor(Math.random() * 3);
            const xPos = LANES[laneIndex];

            const tokenGroup = new THREE.Group();

            const coinGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.18, 16);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.9, roughness: 0.1 });
            const coinMesh = new THREE.Mesh(coinGeo, coinMat);
            coinMesh.rotation.x = Math.PI / 2;
            tokenGroup.add(coinMesh);

            const starGeo = new THREE.BoxGeometry(0.3, 0.3, 0.22);
            const starMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff });
            const starMesh = new THREE.Mesh(starGeo, starMat);
            tokenGroup.add(starMesh);

            tokenGroup.position.set(xPos, 1.2, zPos);
            scene.add(tokenGroup);
            tokens.push(tokenGroup);
        }

        for (let z = 0; z > -300; z -= 15) {
            createBuilding(z, 'left');
            createBuilding(z, 'right');
        }
        for (let z = -40; z > -300; z -= 40) {
            createTrain(z);
            createCoin(z - 15);
            if (Math.random() < 0.70) createPotion(z - 20);
            if (Math.random() < 0.60) createMagnet(z - 30);
            if (Math.random() < 0.30) createToken(z - 35);
        }

        // --- BUTON VE DURUM KONTROLLERİ ---
        function startGame() {
            initAudio();
            gameStarted = true;
            document.getElementById('start-screen').style.display = 'none';
        }

        function togglePause() {
            if (!gameStarted || isGameOver) return;
            isPaused = !isPaused;
            document.getElementById('pause-screen').style.display = isPaused ? 'block' : 'none';
            document.getElementById('btn-pause').innerText = isPaused ? '▶' : '⏸';
        }

        function updatePotionUI() {
            localStorage.setItem('subway_runner_potions', potionCount);
            document.getElementById('potion-count').innerText = potionCount;
            document.getElementById('potion-badge').innerText = potionCount;
        }

        function updateTokenUI() {
            localStorage.setItem('subway_runner_tokens', tokenCount);
            document.getElementById('token-count').innerText = tokenCount;
        }

        function activateSpeedBoost() {
            initAudio();
            if (!gameStarted || isPaused || isGameOver) return;
            if (potionCount > 0 && !isSpeedBoosted) {
                potionCount--;
                updatePotionUI();
                isSpeedBoosted = true;
                speedBoostTimer = 300; // ~5 Saniye
                speedAura.visible = true;
                playSound('boost');
            }
        }

        // --- GİRDİLER ---
        function moveLeft() {
            initAudio();
            if (!gameStarted || isPaused || isGameOver) return;
            if (currentLane > 0) {
                currentLane--;
                targetX = LANES[currentLane];
            }
        }

        function moveRight() {
            initAudio();
            if (!gameStarted || isPaused || isGameOver) return;
            if (currentLane < 2) {
                currentLane++;
                targetX = LANES[currentLane];
            }
        }

        function jump() {
            initAudio();
            if (!gameStarted || isPaused || isGameOver) return;
            if (!isJumping) {
                isJumping = true;
                jumpVelocity = 0.38;
                playSound('jump');
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
            else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') jump();
            else if (e.code === 'ShiftRight') activateSpeedBoost();
            else if (e.key === 'p' || e.key === 'P') togglePause();
        });

        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnJump = document.getElementById('btn-jump');
        const btnSpeed = document.getElementById('btn-speed');

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
        btnLeft.addEventListener('click', moveLeft);

        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });
        btnRight.addEventListener('click', moveRight);

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
        btnJump.addEventListener('click', jump);

        btnSpeed.addEventListener('touchstart', (e) => { e.preventDefault(); activateSpeedBoost(); });
        btnSpeed.addEventListener('click', activateSpeedBoost);

        // --- OYUN DÖNGÜSÜ ---
        function animate() {
            requestAnimationFrame(animate);

            if (!gameStarted || isPaused || isGameOver) {
                renderer.render(scene, camera);
                return;
            }

            // Hız bonusunu hesapla
            baseGameSpeed += 0.00003;
            gameSpeed = isSpeedBoosted ? baseGameSpeed * 2.0 : baseGameSpeed;

            if (isSpeedBoosted) {
                speedBoostTimer--;
                speedAura.rotation.y += 0.1;
                if (speedBoostTimer <= 0) {
                    isSpeedBoosted = false;
                    speedAura.visible = false;
                }
            }

            if (isMagnetActive) {
                magnetTimer--;
                if (magnetTimer <= 0) {
                    isMagnetActive = false;
                    document.getElementById('magnet-ui').style.display = 'none';
                }
            }

            // Dokunulmazlık Süresi Yönetimi
            if (isInvincible) {
                invincibleTimer--;
                playerGroup.visible = Math.floor(invincibleTimer / 10) % 2 === 0;
                if (invincibleTimer <= 0) {
                    isInvincible = false;
                    playerGroup.visible = true;
                }
            }

            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.25;

            railSoundTimer++;
            if (railSoundTimer % 18 === 0) {
                playSound('rail');
            }

            groundY = 0;
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += gameSpeed + obs.userData.moveSpeed;

                const pX = playerGroup.position.x;
                const pY = playerGroup.position.y;
                const pZ = playerGroup.position.z;

                if (obs.userData.isMoving && !obs.userData.hornBlown && obs.position.z > -45 && obs.position.z < -10) {
                    if (Math.abs(obs.position.x - targetX) < 2) {
                        playSound('horn');
                        obs.userData.hornBlown = true;
                    }
                }

                const trainMinX = obs.position.x - obs.userData.width / 2;
                const trainMaxX = obs.position.x + obs.userData.width / 2;
                const trainMinZ = obs.position.z - obs.userData.depth / 2;
                const trainMaxZ = obs.position.z + obs.userData.depth / 2;
                const trainTopY = obs.userData.height;

                const isOverTrainX = pX >= trainMinX - 0.2 && pX <= trainMaxX + 0.2;
                const isOverTrainZ = pZ >= trainMinZ && pZ <= trainMaxZ;

                if (isOverTrainX && isOverTrainZ) {
                    if (pY >= trainTopY - 0.3) {
                        groundY = trainTopY;
                    } else if (!isInvincible) {
                        playSound('crash');
                        endGame();
                    }
                }

                if (obs.position.z > 20) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    createTrain(-250);

                    if (Math.random() < 0.70) createPotion(-260);
                    if (Math.random() < 0.60) createMagnet(-270);
                    if (Math.random() < 0.30) createToken(-280);
                }
            }

            if (isJumping) {
                playerGroup.position.y += jumpVelocity;
                jumpVelocity += gravity;

                if (playerGroup.position.y <= groundY) {
                    playerGroup.position.y = groundY;
                    isJumping = false;
                }
            } else {
                if (playerGroup.position.y > groundY) {
                    isJumping = true;
                    jumpVelocity = 0;
                } else {
                    playerGroup.position.y = groundY;
                }
            }

            animTime += gameSpeed * 0.4;

            if (isJumping) {
                leftArmData.joint.rotation.x = -Math.PI * 0.8;
                rightArmData.joint.rotation.x = -Math.PI * 0.8;
                leftLegData.joint.rotation.x = Math.PI * 0.25;
                rightLegData.joint.rotation.x = -Math.PI * 0.25;
            } else {
                const swing = Math.sin(animTime * 10) * 0.75;
                leftArmData.joint.rotation.x = swing;
                rightArmData.joint.rotation.x = -swing;
                leftLegData.joint.rotation.x = -swing;
                rightLegData.joint.rotation.x = swing;

                body.position.y = 1.4 + Math.abs(Math.sin(animTime * 10)) * 0.08;
            }

            camera.position.y = 4.5 + playerGroup.position.y * 0.5;

            for (let i = buildings.length - 1; i >= 0; i--) {
                const bldg = buildings[i];
                bldg.position.z += gameSpeed;

                if (bldg.position.z > 20) {
                    scene.remove(bldg);
                    buildings.splice(i, 1);
                    const side = bldg.position.x < 0 ? 'left' : 'right';
                    createBuilding(-280, side);
                }
            }

            // --- ALTINLAR VE MIKNATIS ÇEKİMİ ---
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.position.z += gameSpeed;
                coin.rotation.z += 0.05;

                if (isMagnetActive && coin.position.z > -30 && coin.position.z < 5) {
                    coin.position.x += (playerGroup.position.x - coin.position.x) * 0.15;
                    coin.position.y += (playerGroup.position.y + 1.2 - coin.position.y) * 0.15;
                    coin.position.z += (playerGroup.position.z - coin.position.z) * 0.15;
                }

                const playerBox = new THREE.Box3().setFromObject(playerGroup);
                const coinBox = new THREE.Box3().setFromObject(coin);

                if (playerBox.intersectsBox(coinBox)) {
                    playSound('coin');
                    scene.remove(coin);
                    coins.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;

                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('subway_runner_highscore', highScore);
                        document.getElementById('high-score').innerText = highScore;
                    }

                    createCoin(-250);
                } else if (coin.position.z > 20) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                    createCoin(-250);
                }
            }

            // --- İKSİRLER VE MIKNATIS ÇEKİMİ ---
            for (let i = potions.length - 1; i >= 0; i--) {
                const pot = potions[i];
                pot.position.z += gameSpeed;
                pot.rotation.y += 0.03;

                if (isMagnetActive && pot.position.z > -30 && pot.position.z < 5) {
                    pot.position.x += (playerGroup.position.x - pot.position.x) * 0.15;
                    pot.position.y += (playerGroup.position.y + 1.0 - pot.position.y) * 0.15;
                    pot.position.z += (playerGroup.position.z - pot.position.z) * 0.15;
                }

                const playerBox = new THREE.Box3().setFromObject(playerGroup);
                const potBox = new THREE.Box3().setFromObject(pot);

                if (playerBox.intersectsBox(potBox)) {
                    playSound('powerup');
                    scene.remove(pot);
                    potions.splice(i, 1);
                    potionCount++;
                    updatePotionUI();
                } else if (pot.position.z > 20) {
                    scene.remove(pot);
                    potions.splice(i, 1);
                }
            }

            // --- MIKNATIS TOPLAMA ---
            for (let i = magnets.length - 1; i >= 0; i--) {
                const mag = magnets[i];
                mag.position.z += gameSpeed;
                mag.rotation.y += 0.02;

                const playerBox = new THREE.Box3().setFromObject(playerGroup);
                const magBox = new THREE.Box3().setFromObject(mag);

                if (playerBox.intersectsBox(magBox)) {
                    playSound('powerup');
                    scene.remove(mag);
                    magnets.splice(i, 1);
                    isMagnetActive = true;
                    magnetTimer = 480; // ~8 Saniye
                    document.getElementById('magnet-ui').style.display = 'block';
                } else if (mag.position.z > 20) {
                    scene.remove(mag);
                    magnets.splice(i, 1);
                }
            }

            // --- JETON TOPLAMA ---
            for (let i = tokens.length - 1; i >= 0; i--) {
                const tok = tokens[i];
                tok.position.z += gameSpeed;
                tok.rotation.y += 0.04;

                if (isMagnetActive && tok.position.z > -30 && tok.position.z < 5) {
                    tok.position.x += (playerGroup.position.x - tok.position.x) * 0.15;
                    tok.position.y += (playerGroup.position.y + 1.0 - tok.position.y) * 0.15;
                    tok.position.z += (playerGroup.position.z - tok.position.z) * 0.15;
                }

                const playerBox = new THREE.Box3().setFromObject(playerGroup);
                const tokBox = new THREE.Box3().setFromObject(tok);

                if (playerBox.intersectsBox(tokBox)) {
                    playSound('powerup');
                    scene.remove(tok);
                    tokens.splice(i, 1);
                    tokenCount++;
                    updateTokenUI();
                } else if (tok.position.z > 20) {
                    scene.remove(tok);
                    tokens.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-high-score').innerText = highScore;

            const btnRevive = document.getElementById('btn-revive');
            if (tokenCount > 0) {
                btnRevive.style.display = 'block';
                btnRevive.innerText = `🪙 JETON KULLAN (Kalan: ${tokenCount})`;
            } else {
                btnRevive.style.display = 'none';
            }

            document.getElementById('game-over').style.display = 'block';
        }

        function reviveGame() {
            if (tokenCount <= 0) return;

            tokenCount--;
            updateTokenUI();

            isGameOver = false;
            document.getElementById('game-over').style.display = 'none';

            for (let i = obstacles.length - 1; i >= 0; i--) {
                if (obstacles[i].position.z > -20 && obstacles[i].position.z < 15) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                }
            }

            isJumping = false;
            playerGroup.position.y = 0;
            isInvincible = true;
            invincibleTimer = 120;
            playSound('revive');
        }

        function resetGame() {
            isGameOver = false;
            isPaused = false;
            score = 0;
            baseGameSpeed = 0.45;
            gameSpeed = 0.45;
            currentLane = 1;
            targetX = LANES[currentLane];
            playerGroup.position.set(0, 0, 0);
            groundY = 0;
            isJumping = false;
            animTime = 0;
            railSoundTimer = 0;

            isSpeedBoosted = false;
            speedBoostTimer = 0;
            speedAura.visible = false;

            isMagnetActive = false;
            magnetTimer = 0;
            isInvincible = false;
            invincibleTimer = 0;
            playerGroup.visible = true;

            document.getElementById('magnet-ui').style.display = 'none';
            updatePotionUI();
            updateTokenUI();

            document.getElementById('score').innerText = '0';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('pause-screen').style.display = 'none';
            document.getElementById('btn-pause').innerText = '⏸';

            obstacles.forEach(obs => scene.remove(obs));
            coins.forEach(coin => scene.remove(coin));
            potions.forEach(pot => scene.remove(pot));
            magnets.forEach(mag => scene.remove(mag));
            tokens.forEach(tok => scene.remove(tok));

            obstacles.length = 0;
            coins.length = 0;
            potions.length = 0;
            magnets.length = 0;
            tokens.length = 0;

            for (let z = -40; z > -300; z -= 40) {
                createTrain(z);
                createCoin(z - 15);
                if (Math.random() < 0.70) createPotion(z - 20);
                if (Math.random() < 0.60) createMagnet(z - 30);
                if (Math.random() < 0.30) createToken(z - 35);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
